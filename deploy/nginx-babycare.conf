# HD²LAB BabyCare Nginx Reverse Proxy Configuration
# Subpath: /babycare/ and /api/babycare/v1/
# Domain: hd2lab.duckdns.org

# 1. API Reverse Proxy
location /api/babycare/v1/ {
    proxy_pass http://127.0.0.1:8004/api/babycare/v1/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Pass Google OAuth headers if provided by upstream auth gate
    proxy_set_header X-User-Id $http_x_user_id;
    proxy_set_header X-User-Email $http_x_user_email;
    proxy_set_header X-User-Name $http_x_user_name;

    # Timeouts for AI generation
    proxy_connect_timeout 60s;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    client_max_body_size 10M;
}

# 2. Frontend Static SPA
location /babycare/ {
    alias /Users/jaehyukshim/AGWS/AGPilot0004/services/babycare/frontend/dist/;
    index index.html;
    try_files $uri $uri/ /babycare/index.html;

    # Cache static assets
    location ~* \.(?:ico|css|js|gif|jpe?g|png|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }
}
